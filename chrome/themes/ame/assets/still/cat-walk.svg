  <rect class="l2" x="28" y="18" width="3" height="10" rx="1.5"/>
  <rect class="l1" x="32" y="18" width="3" height="10" rx="1.5"/>
  <ellipse cx="22" cy="16" rx="15" ry="6.5"/>
  <circle cx="38" cy="11" r="6.5"/>
